name: Set up Rust
description: >-
  Install the Rust toolchain pinned in rust-toolchain.toml and restore the
  Cargo cache. Single source of truth for the preamble every Cargo job in
  this repository repeats, so the action pins live in one place.

inputs:
  components:
    description: >-
      Comma-separated rustup components to install alongside the toolchain
      (e.g. "rustfmt, clippy"). Empty installs the toolchain on its own.
    required: false
    default: ""
  cache-key:
    description: Extra key that separates this job's Cargo cache from others.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # SHA-pinned, so the toolchain cannot be read from the ref name. It must
    # match the `channel` in rust-toolchain.toml, which rustup honours for
    # every cargo command anyway.
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
      with:
        toolchain: "1.99.0"
        components: ${{ inputs.components }}

    - name: Cache Cargo registry and target directory
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        key: ${{ inputs.cache-key }}
