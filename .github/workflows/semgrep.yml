name: Semgrep

# Static application security testing (SAST) on every pull request. The
# container image is pinned by tag *and* immutable digest: Docker resolves the
# digest, and the tag beside it is what an update tool bumps from.

on:
  pull_request:
    branches: [Develop, main, milestone/*]

permissions:
  contents: read

# Only the latest run for a given ref matters, so a per-ref group with
# cancellation stops rapid pushes spawning parallel, redundant work.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: semgrep/semgrep:1.173.0@sha256:67319956da3dcb58baf5b322899c15458e3963e7018a86aeeb5cd224e69cb77a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so the job token must not be left behind
          # in .git/config where a later step could read it.
          persist-credentials: false
      - run: semgrep ci --config p/default
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
