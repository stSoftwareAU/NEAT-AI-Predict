name: ShellCheck

# Shell script gates: `bash -n` syntax check and ShellCheck lint over every
# `*.sh` file in the repository. ShellCheck is downloaded from a
# version-pinned upstream release and verified against its SHA-256 checksum,
# rather than taken from whatever the runner image happens to ship. It also
# runs the repository's own script unit tests.

on:
  pull_request:
    branches: [Develop, main, milestone/*]

permissions:
  contents: read

# Only the latest run for a given ref matters, so a per-ref group with
# cancellation stops rapid pushes spawning parallel, redundant work.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SHELLCHECK_VERSION: "0.11.0"
      SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so the job token must not be left behind
          # in .git/config where a later step could read it.
          persist-credentials: false
      - name: Check bash syntax
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r script; do
            if ! bash -n "$script"; then
              echo "bash -n failed: $script" >&2
              status=1
            fi
          done < <(git ls-files '*.sh')
          exit "$status"
      - name: Install pinned ShellCheck
        run: |
          set -euo pipefail
          archive="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -sSfL --retry 3 \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${archive}" \
            -o "$archive"
          echo "${SHELLCHECK_SHA256}  ${archive}" | sha256sum -c -
          tar -xJf "$archive"
          echo "${PWD}/shellcheck-v${SHELLCHECK_VERSION}" >> "$GITHUB_PATH"
      - name: Run ShellCheck
        run: |
          set -euo pipefail
          git ls-files -z '*.sh' | xargs -0 --no-run-if-empty shellcheck -x --severity=style
      - name: Sourced and called script paths exist (issue #29)
        run: ./scripts/test-script-refs.sh
      - name: cargo-update-quarantined helper tests (issue #32)
        run: ./scripts/test-cargo-update-quarantined.sh
      - name: Every quality.sh script test runs in a PR workflow (issue #32)
        run: ./scripts/test-ci-script-tests.sh
