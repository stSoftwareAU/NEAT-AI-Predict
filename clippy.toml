# Clippy configuration. Lint levels live in `[workspace.lints.clippy]` in
# Cargo.toml; this file only tunes how individual lints behave.

# `unwrap()` / `expect()` are denied in production code but are the clearest
# way to state an expectation inside a test.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-print-in-tests = true
