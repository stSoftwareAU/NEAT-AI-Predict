# cargo-deny policy — licences, advisories, bans and sources.
# https://embarkstudios.github.io/cargo-deny/
#
# Run: cargo deny check

[graph]
targets = []
all-features = true

[licenses]
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    # MIT without the attribution clause, so no stricter than MIT.
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unlicense",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
# A `*` version requirement accepts any future release, including a hijacked
# one, so it is refused outright.
wildcards = "deny"
highlight = "lowest-version"

[advisories]
# Every entry here needs a comment naming the advisory, why it does not apply,
# and the issue that tracks removing the exception.
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# neat-core: the fleet's activation engine, pinned to a release tag in Cargo.toml.
allow-git = ["https://github.com/stSoftwareAU/NEAT-AI-core"]
